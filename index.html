    th{font-size:8pt!important;padding:5pt 7pt!important;background:#0b1f3a!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}

<main>

<div class="proj-section no-print" id="projSection">

</div>

<div class="mob-tabs">

<div class="grid">
  <div class="card mob-active" data-tab="dp-in">
    <h2>輸入參數</h2>
    <div class="sec">簡化三角形水文法</div>
    <div class="row3">
      <div><label>開發後設計洪峰流入量 Qi (m³/s)</label><input id="dp-qi" type="number" value="2.5" step="0.1"></div>
      <div><label>容許洪峰排放量 Qo (m³/s)</label><input id="dp-qo" type="number" value="0.8" step="0.1"></div>
      <div><label>集流時間 Tc (分鐘)</label><input id="dp-tc" type="number" value="15" step="1"></div>
    </div>
    <button class="calc-btn" onclick="calcDP()">計算雨水滯洪池容量</button>
    <div class="note">本工具採用簡化三角形水文法（保守估算），假設流入歷線為三角形、流出為定量排放，適用初步規劃。實際設計應以修正合理化公式或水庫演算法（Storage Routing）建立入流/出流歷線並考慮滯洪池調蓄曲線（水位-容積-出流關係），經水利技師複核後定案。</div>

<script>
function switchMobTab(name,btn){
  btn.parentElement.querySelectorAll('.mob-tab').forEach(function(t){t.classList.remove('active');});
  btn.classList.add('active');
  btn.parentElement.nextElementSibling.querySelectorAll('.card').forEach(function(c){
    c.classList.toggle('mob-active',c.dataset.tab===name);
  });
}
function openPro(){ JRH.checkEmail(function(){ jrhPrint('雨水滯洪池容量設計計算書'); }); }
function v(id){return parseFloat(document.getElementById(id).value)||0;}
function f1(x){return x.toFixed(1);}
function f2(x){return x.toFixed(2);}

function calcDetentionPondStorage(qi, qo, tc){
  var ti = 2 * tc;
  var tiSec = ti * 60;
  var deltaQ = qi - qo;
  var storageRaw = 0.5 * deltaQ * tiSec;
  var needsStorage = deltaQ > 0;
  var vs = needsStorage ? storageRaw : 0;
  var liters = vs * 1000;
  return {
    qi: qi,
    qo: qo,
    tc: tc,
    ti: ti,
    tiSec: tiSec,
    deltaQ: deltaQ,
    storageRaw: storageRaw,
    vs: vs,
    liters: liters,
    needsStorage: needsStorage
  };
}

function calcDP(){
  var data = calcDetentionPondStorage(v('dp-qi'), v('dp-qo'), v('dp-tc'));
  var resultHtml =
    '<table><tr><th>項目</th><th>數值</th></tr>'+
    '<tr><td>流入歷線基期 ti</td><td>'+f1(data.ti)+' 分鐘（'+f1(data.tiSec)+' 秒）</td></tr>'+
    '<tr><td>所需滯洪容積 Vs</td><td>'+f2(data.vs)+' m³</td></tr>'+
    '<tr><td>所需滯洪容積 Vs</td><td>'+f2(data.liters)+' L</td></tr>'+
    '</table>';
  if(!data.needsStorage){
    resultHtml += '<p class="ok" style="margin-top:12px">流入量未超過容許排放量，理論上不需額外滯洪容積。</p>';
  }
  document.getElementById('dp-result').innerHTML = resultHtml;

  if(window.JRH && JRH.saveOutput) JRH.saveOutput({vs_m3:data.vs});

  var p = '';
  p += '【雨水滯洪池容量設計計算過程】\n\n';
  p += '一、輸入條件\n';
  p += '  開發後設計洪峰流入量 Qi = '+f2(data.qi)+' m³/s\n';
  p += '  容許洪峰排放量 Qo = '+f2(data.qo)+' m³/s\n';
  p += '  集流時間 Tc = '+f1(data.tc)+' 分鐘\n\n';
  p += '二、依簡化三角形水文法計算流入歷線基期\n';
  p += '  ti = 2 × Tc = 2 × '+f1(data.tc)+' = '+f1(data.ti)+' 分鐘\n';
  p += '  ti_sec = ti × 60 = '+f1(data.ti)+' × 60 = '+f1(data.tiSec)+' 秒\n\n';
  p += '三、計算所需滯洪容積\n';
  p += '  Qi − Qo = '+f2(data.qi)+' − '+f2(data.qo)+' = '+f2(data.deltaQ)+' m³/s\n';
  if(data.needsStorage){
    p += '  Vs = 0.5 × (Qi − Qo) × ti_sec\n';
    p += '     = 0.5 × '+f2(data.deltaQ)+' × '+f1(data.tiSec)+'\n';
    p += '     = '+f2(data.vs)+' m³\n';
    p += '  換算公升 = '+f2(data.vs)+' × 1000 = '+f2(data.liters)+' L\n';
  }else{
    p += '  因 Qi ≤ Qo，開發後洪峰流入量未超過容許排放量\n';
    p += '  依本工具邏輯，Vs 不取負值，故採 Vs = 0.00 m³\n';
    p += '  換算公升 = 0.00 L\n';
    p += '  結論：流入量未超過容許排放量，理論上不需額外滯洪容積。\n';
  }
  document.getElementById('dp-proc-text').textContent = p;
  document.getElementById('dp-proc').style.display = '';
  if(window.innerWidth<768){
    var b = document.getElementById('mobTab-dp-r');
    if(b) switchMobTab('dp-r', b);
  }
}

calcDP();

function jrhTryInbound(){
  if(!(window.JRH && JRH.showInboundBanner))return;
  JRH.showInboundBanner('ro','逕流廢水削減計畫',function(data){
    document.getElementById('dp-qi').value=data.Q_m3s.toFixed(4);
    document.getElementById('dp-tc').value=data.tc_min;
    calcDP();
  });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',jrhTryInbound);
else jrhTryInbound();
</script>
